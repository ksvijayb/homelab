apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: postgresql
  namespace: databases
spec:
  chart:
    spec:
      chart: postgresql
      version: 12.3.17
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  interval: 5m
  values:
    global:
      storageClass: hostpath
    primary:
      persistence:
        enabled: true
        size: 20Gi
    metrics:
      enabled: false