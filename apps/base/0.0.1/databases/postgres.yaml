apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: db
spec:
  interval: 10m
  releaseName: postgresql

  chart:
    spec:
      chart: postgresql
      version: "12.12.10"          # ARM64-compatible Bitnami version
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:

    global:
      storageClass: "local-path"

    # PostgreSQL authentication
    auth:
      postgresPassword: postgres
      username: zitadel
      password: zitadelpass
      database: zitadel

    architecture: standalone

    primary:
      persistence:
        enabled: true
        size: 6Gi
        storageClass: "local-path"

      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # ✔ FIXED: ARM64-compatible init image
    volumePermissions:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/os-shell   # ✔ correct image
        tag: "latest"                  # ✔ confirmed ARM64 supported
