apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: db
spec:
  interval: 10m
  releaseName: postgresql
  chart:
    spec:
      chart: postgresql
      version: "12.12.10"   # WORKING ARM64 version
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:

    global:
      compatibility:
        openshift: false
      storageClass: "local-path"

    image:
      tag: "16.3.0-debian-12-r0"   # ARM64 supported

    tls:
      enabled: false

    auth:
      postgresPassword: postgres
      username: zitadel
      password: zitadelpass
      database: zitadel

    primary:
      persistence:
        enabled: true
        size: 4Gi

      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # FORCE ARM64 compatible images
    architecture: standalone
    volumePermissions:
      enabled: true
      image:
        repository: bitnami/bitnami-shell
        tag: "12-debian-12-r16"   # ARM64 WORKS
