apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: db
spec:
  interval: 10m
  releaseName: postgresql

  chart:
    spec:
      chart: postgresql
      version: "12.12.10"            # Chart version is OK
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:

    global:
      storageClass: "local-path"

    # ============================================
    # MAIN POSTGRESQL IMAGE (YOU REQUESTED THIS)
    # ============================================
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: "16.3.0-debian-12-r20"     # <-- ARM64-COMPATIBLE POSTGRESQL IMAGE
      pullPolicy: IfNotPresent

    # ============================================
    # AUTH / DB CONFIGURATION
    # ============================================
    auth:
      postgresPassword: postgres
      username: zitadel
      password: zitadelpass
      database: zitadel

    architecture: standalone

    # ============================================
    # PRIMARY POD / STORAGE CONFIG
    # ============================================
    primary:
      persistence:
        enabled: true
        storageClass: "local-path"
        size: 6Gi

      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # ============================================
    # INIT CONTAINER FIX (volumePermissions)
    # ============================================
    volumePermissions:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/os-shell      # <-- INIT CONTAINER IMAGE
        tag: "latest"                     # <-- WORKS ON ARM64
        pullPolicy: IfNotPresent
