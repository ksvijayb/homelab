apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: db
spec:
  interval: 10m
  releaseName: postgresql

  chart:
    spec:
      chart: postgresql
      version: "15.5.14"   # Verified ARM64-friendly
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 10m

  values:

    # ------------------------------
    # Authentication / DB Settings
    # ------------------------------
    auth:
      postgresPassword: postgres
      username: zitadel
      password: zitadelpass
      database: zitadel

    # ------------------------------
    # Primary Database Settings
    # ------------------------------
    primary:
      persistence:
        enabled: true
        storageClass: "local-path"     # IMPORTANT
        size: 10Gi                      # adjust as needed

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001

    # ------------------------------
    # General Settings
    # ------------------------------
    architecture: standalone

    volumePermissions:
      enabled: true

    image:
      tag: "16.3.0-debian-12-r3"   # Latest stable ARM64-compatible image
