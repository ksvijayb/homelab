apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: guacamole
  namespace: guacamole
spec:
  interval: 15m
  chart:
    spec:
      chart: guacamole
      version: "0.5.x"
      sourceRef:
        kind: HelmRepository
        name: guacamole
        namespace: flux-system
  values:
    image:
      tag: "1.5.5"

    guacamole:
      admin:
        username: admin
        password: admin123   # 🔴 Change this after first login

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: guacamole.atlas.lan
          paths:
            - path: /
              pathType: Prefix

    postgresql:
      enabled: true
      auth:
        username: guacdb
        password: guacdbpass
        database: guacamole_db
      primary:
        persistence:
          enabled: true
          size: 5Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
