apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: apps
spec:
  interval: 10m
  releaseName: pihole

  chart:
    spec:
      chart: ./charts/apps/pihole/0
      version: "0.2.0"
      sourceRef:
        kind: GitRepository
        name: lab-apps-public
        namespace: flux-system
      interval: 1m

  # Inline values patch/override
  values:

    labels: "pihole"

    replicaCount: 1

    image:
      repository: pihole/pihole
      tag: "2025.11.0"
      pullPolicy: Always

    timezone: Asia/Kolkata

    hostNetwork: true

    persistence:
      config:
        enabled: true
        hostPath: "/srv/data/appdata/pihole/config"

    service:
      nodePorts:
        http: 30080
        https: 30443
      type: NodePort

    ingress:
      enabled: false
      

    containerSecurityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_NICE
              - SYS_TIME