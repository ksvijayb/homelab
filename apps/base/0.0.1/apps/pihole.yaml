---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  chart:
    spec:
      chart: ./charts/apps/pihole/0
      sourceRef:
        kind: GitRepository
        name: lab-apps-public
        namespace: flux-system
  interval: 10m0s
  releaseName: pihole
  values:
    replicaCount: 1
    image:
      repository: pihole/pihole
      tag: "2025.11.0"
      pullPolicy: IfNotPresent
    timezone: Asia/Kolkata
    hostNetwork: true
    persistence:
      config:
        enabled: true
        hostPath: /srv/dev-disk-by-uuid-5a4e43af-4c67-438d-a426-b7df3322fbe6/appdata/pihole/config