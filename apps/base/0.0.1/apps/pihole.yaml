apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: apps
spec:
  interval: 10m
  releaseName: pihole

  chart:
    spec:
      chart: ./charts/media/pihole
      version: "0.2.0"
      sourceRef:
        kind: GitRepository
        name: lab-apps-public
        namespace: flux-system
      interval: 1m

  # Inline values patch/override
  values:

    labels: "pihole"

    replicaCount: 1

    image:
      repository: pihole/pihole
      tag: "2025.11.0"
      pullPolicy: Always

    timezone: Asia/Kolkata

    hostNetwork: true

    persistence:
      config:
        enabled: true
        hostPath: "/srv/dev-disk-by-uuid-5a4e43af-4c67-438d-a426-b7df3322fbe6/appdata/pihole/config"

    service:
      type: ClusterIP
      port: 80
      additionalPorts:
        - name: https
          port: 443
          targetPort: 443

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
      host: "pihole.atlas"
      path: /
      pathType: Prefix
      tls:
        enabled: false
        secretName: ""
