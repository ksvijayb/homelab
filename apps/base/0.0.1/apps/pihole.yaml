apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: apps
spec:
  interval: 10m
  releaseName: pihole

  chart:
    spec:
      chart: ./charts/apps/pihole/0
      version: "0.2.0"
      sourceRef:
        kind: GitRepository
        name: lab-apps-public
        namespace: flux-system
      interval: 1m

  values:

    labels: "pihole"

    replicaCount: 1

    image:
      repository: pihole/pihole
      tag: "2025.11.0"
      pullPolicy: Always

    timezone: Asia/Kolkata

    # DNS requires host network
    hostNetwork: true

    # Override Pi-hole UI port to avoid conflict with Traefik
    extraEnvVars:
      - name: WEB_PORT
        value: "31080"
      - name: DNSMASQ_LISTENING
        value: "all"

    persistence:
      config:
        enabled: true
        hostPath: "/srv/data/appdata/pihole/config"

    # UI exposed via NodePort
    service:
      type: NodePort
      port: 31080          # internal lighttpd port
      nodePorts:
        http: 30080
        https: 30443

    # Ingress disabled
    ingress:
      enabled: false

    containerSecurityContext:
      runAsUser: 0
      allowPrivilegeEscalation: true
      capabilities:
        add:
          - NET_ADMIN
          - NET_BIND_SERVICE
          - NET_RAW
          - SYS_NICE
          - SYS_TIME
