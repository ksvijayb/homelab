apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "9.2.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    kubectl:
      image:
        registry: docker.io
        repository: bitnami/kubectl
        tag: "1.30.4"
        pullPolicy: IfNotPresent

    # 🔴 THIS FILE IS WHAT THE INIT JOB READS
    zitadelConfig: |
      ExternalDomain: zitadel.atlas.lan
      ExternalSecure: true
      ExternalPort: 443

      Database:
        Type: postgres
        Postgres:
          Host: postgresql.db.svc.cluster.local
          Port: 5432
          User:
            Username: zitadel
            Password: zitadelpass
          Database: zitadel
          SSL:
            Mode: disable

      # 🔴 REQUIRED FOR v9+
      FirstInstance:
        Org:
          Name: "atlas"
        User:
          Username: "admin"
          Password: "Admin@123"
        Machine:
          Name: "atlas-machine"

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []
