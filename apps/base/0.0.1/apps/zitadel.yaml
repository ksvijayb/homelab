apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "7.5.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    # 🟢 Zitadel reads this as /config/zitadel-config-yaml
    zitadelConfig: |
      ExternalDomain: zitadel.atlas.lan
      ExternalSecure: true
      ExternalPort: 443

      Database:
        Postgres:
          Host: postgresql.db.svc.cluster.local
          Port: 5432
          User:
            Username: zitadel
            Password: zitadelpass
          Database: zitadel
          SSL:
            Mode: disable

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: "zitadel.atlas.lan"
          paths:
            - path: /
              pathType: Prefix
      tls: []
