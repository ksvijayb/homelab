apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "6.2.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    # =========================
    # Master Key
    # =========================
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    # =========================
    # Database (external PostgreSQL)
    # =========================
    db:
      type: postgres
      postgres:
        host: postgresql.db.svc.cluster.local
        port: 5432
        database: zitadel
        user: zitadel
        password: zitadelpass
        ssl:
          mode: disable

    # =========================
    # Init / Setup Configuration
    # -------------------------
    # This block defines how Zitadel init job
    # bootstraps the first instance and admin user.
    # =========================
    initConfig:
      firstInstance:
        org:
          name: "atlas"
        user:
          username: admin
          firstname: Admin
          lastname: User
          email: admin@atlas.lan
          password: "Admin@123"

    # =========================
    # External Access
    # =========================
    externalDomain: "zitadel.atlas.lan"
    externalSecure: true

    # =========================
    # Ingress (Traefik)
    # =========================
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: "zitadel.atlas.lan"
          paths:
            - path: /
              pathType: Prefix
      tls: []

    # =========================
    # Service
    # =========================
    service:
      type: ClusterIP
