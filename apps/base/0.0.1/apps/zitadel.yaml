apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "6.2.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:
    # -------------------------
    # Core
    # -------------------------
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    # -------------------------
    # DATABASE (6.2.0 requires BOTH)
    # -------------------------
    db:
      type: postgres

      cockroach:
        enabled: false   # 🔴 REQUIRED, otherwise localhost:26257 is used

      postgres:
        host: postgresql.db.svc.cluster.local
        port: 5432
        database: zitadel
        user: zitadel
        password: zitadelpass
        ssl:
          mode: disable

    # -------------------------
    # Init bootstrap
    # -------------------------
    init:
      firstInstance:
        org:
          name: atlas
        user:
          username: admin
          firstname: Admin
          lastname: User
          email: admin@atlas.lan
          password: "Admin@123"

    # -------------------------
    # External access
    # -------------------------
    externalDomain: zitadel.atlas.lan
    externalSecure: true

    # -------------------------
    # Ingress
    # -------------------------
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []

    service:
      type: ClusterIP
