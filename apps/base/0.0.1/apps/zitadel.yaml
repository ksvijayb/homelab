apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "9.13.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:
    zitadel:
      masterkey: "uWwitDqXzqOgSRx1GxvYpG04xNckF89H"

    # 🔑 Force compose-style startup
    command:
      - start-from-init
      - --masterkey
      - uWwitDqXzqOgSRx1GxvYpG04xNckF89H

    # 🔑 EXACT env vars from docker-compose
    extraEnv:
    # -----------------------------
    # PostgreSQL HOST / PORT
    # -----------------------------
    - name: ZITADEL_DATABASE_POSTGRES_HOST
      value: postgresql.db
    - name: ZITADEL_DATABASE_POSTGRES_PORT
      value: "5432"

    # -----------------------------
    # ADMIN USER (BOOTSTRAP)
    # -----------------------------
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
      value: postgres
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
      value: postgres
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
      value: disable

    # -----------------------------
    # APPLICATION USER
    # -----------------------------
    - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
      value: zitadel
    - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
      value: zitadelpass
    - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
      value: disable

    - name: ZITADEL_DATABASE_POSTGRES_DATABASE
      value: zitadel

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix

    service:
      type: ClusterIP
