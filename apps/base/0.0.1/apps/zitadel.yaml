apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "6.8.0"   # ✅ stable, homelab-safe
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    # --------------------------------------------------
    # Database (external PostgreSQL – WORKS in v6)
    # --------------------------------------------------
    database:
      type: postgres
      postgres:
        host: postgresql.db.svc.cluster.local
        port: 5432
        database: zitadel
        user: zitadel
        password: zitadelpass
        ssl:
          mode: disable

    # --------------------------------------------------
    # External access
    # --------------------------------------------------
    externalDomain: zitadel.atlas.lan
    externalSecure: true

    # --------------------------------------------------
    # First admin bootstrap (v6 style – SIMPLE)
    # --------------------------------------------------
    firstInstance:
      enabled: true
      org:
        name: atlas
      user:
        username: admin
        firstname: Admin
        lastname: User
        email: admin@atlas.lan
        password: Admin@123   # change after first login

    # --------------------------------------------------
    # Ingress (Traefik)
    # --------------------------------------------------
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []

    service:
      type: ClusterIP
