apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "9.2.0"        # ✔ Zitadel v9
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    # -------------------------------
    # Zitadel config (v2 format)
    # -------------------------------
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    zitadelConfig: |
      ExternalDomain: zitadel.atlas.lan
      ExternalSecure: true
      ExternalPort: 443

      Database:
        Type: postgres
        Postgres:
          Host: postgresql.db.svc.cluster.local
          Port: 5432
          User:
            Username: zitadel
            Password: zitadelpass
          Database: zitadel
          SSL:
            Mode: disable

      # Required for v9 init job
      FirstInstance:
        Org:
          Name: "atlas"
        Name: "admin"
        Domain: "zitadel.atlas.lan"

    # -------------------------------
    # Ingress (Traefik)
    # -------------------------------
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: "zitadel.atlas.lan"
          paths:
            - path: /
              pathType: Prefix
      tls: []

    # -------------------------------
    # Service
    # -------------------------------
    service:
      type: ClusterIP
