apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "6.2.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:
    # -------------------------------------------------
    # ZITADEL CORE
    # -------------------------------------------------
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="

    # -------------------------------------------------
    # DATABASE (6.2.0 schema)
    # -------------------------------------------------
    db:
      type: postgres
      postgres:
        host: postgresql.db.svc.cluster.local
        port: 5432
        database: zitadel
        user: zitadel
        password: zitadelpass
        ssl:
          mode: disable

    # -------------------------------------------------
    # FIRST INSTANCE BOOTSTRAP (6.2.0)
    # -------------------------------------------------
    init:
      firstInstance:
        org:
          name: atlas
        user:
          username: admin
          firstname: Admin
          lastname: User
          email: admin@atlas.lan
          password: "Admin@123"

    # -------------------------------------------------
    # EXTERNAL ACCESS
    # -------------------------------------------------
    externalDomain: zitadel.atlas.lan
    externalSecure: true

    # -------------------------------------------------
    # INGRESS (Traefik)
    # -------------------------------------------------
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []

    service:
      type: ClusterIP
