apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  interval: 10m
  releaseName: zitadel

  chart:
    spec:
      chart: zitadel
      version: "6.4.0"   # ✔ last version with working external Postgres
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="
      replicaCount: 1

    database:
      type: postgres
      postgres:
        host: postgresql.db.svc.cluster.local
        port: 5432
        user: zitadel
        password: zitadelpass
        database: zitadel
        sslMode: disable

    image:
      registry: ghcr.io
      repository: zitadel/zitadel
      tag: "v2.33.5"   # ✔ correct for chart 6.4.0, supports external PG

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: "zitadel.atlas.lan"
          paths:
            - path: /
              pathType: Prefix
      tls: []
