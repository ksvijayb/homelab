apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  interval: 10m
  releaseName: zitadel

  chart:
    spec:
      chart: zitadel
      version: "9.2.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    # =========================
    # Core Zitadel settings
    # =========================
    zitadel:
      masterkey: "3cPOX4bvn8kyiVnpsSZcJXJyQLgEUVTn4Qw6t09n3vk="
      replicaCount: 1

    # =========================
    # Embedded CockroachDB
    # =========================
    cockroachdb:
      enabled: true
      singleNode: true

      persistence:
        enabled: true
        storageClass: local-path
        size: 5Gi

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1Gi

    # =========================
    # Zitadel config
    # =========================
    zitadelConfig: |
      ExternalDomain: zitadel.atlas.lan
      ExternalSecure: true
      ExternalPort: 443

      FirstInstance:
        Org:
          Name: "atlas"
        User:
          Username: "admin"
          Password: "Admin@123"

    # =========================
    # Ingress (Traefik)
    # =========================
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []
