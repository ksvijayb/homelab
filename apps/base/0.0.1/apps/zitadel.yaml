apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: apps
spec:
  releaseName: zitadel
  interval: 10m

  chart:
    spec:
      chart: zitadel
      version: "9.13.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system

  values:

    # ==========================================================
    # ZITADEL CORE CONFIGURATION (WRITTEN TO CONFIGMAP)
    # ==========================================================
    zitadel:
      masterkey: "uWwitDqXzqOgSRx1GxvYpG04xNckF89H"

      configmapConfig:
        ExternalDomain: "zitadel.atlas.lan"
        ExternalSecure: true

        Database:
          Type: postgres
          Postgres:
            Host: postgresql.db.svc.cluster.local
            Port: 5432
            Database: zitadel

            # Application user
            User:
              Username: zitadel
              Password: zitadelpass

            # Admin user (bootstrap)
            Admin:
              Username: postgres
              Password: postgres

            SSL:
              Mode: disable

        # ------------------------------------------------------
        # FIRST INSTANCE BOOTSTRAP (IAM ADMIN + LOGIN CLIENT)
        # ------------------------------------------------------
        FirstInstance:
          Skip: false

          Org:
            Machine:
              Machine:
                Username: iam-admin
                Name: Automatically Initialized IAM Admin
              MachineKey:
                ExpirationDate: "2029-01-01T00:00:00Z"
                Type: 1
              Pat:
                ExpirationDate: "2029-01-01T00:00:00Z"

            LoginClient:
              Machine:
                Username: login-client
                Name: Automatically Initialized IAM Login Client
              Pat:
                ExpirationDate: "2029-01-01T00:00:00Z"

        Machine:
          Identification:
            Hostname:
              Enabled: true
            Webhook:
              Enabled: false

    # ==========================================================
    # FIX: SETUP JOB IMAGE (alpine/k8s DOES NOT EXIST)
    # ==========================================================
    setupJob:
      machinekeyWriter:
        image:
          repository: bitnami/kubectl
          tag: "1.29.4"
          pullPolicy: IfNotPresent

    # ==========================================================
    # SERVICE
    # ==========================================================
    service:
      type: ClusterIP

    # ==========================================================
    # INGRESS (TRAEFIK)
    # ==========================================================
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: zitadel.atlas.lan
          paths:
            - path: /
              pathType: Prefix
      tls: []
