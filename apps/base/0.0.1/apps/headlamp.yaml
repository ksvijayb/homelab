apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  chart:
    spec:
      chart: ./charts/headlamp
      version: 0.1.0
      sourceRef:
        kind: GitRepository
        name: atlas-repo
        namespace: flux-system
  interval: 5m
  values:
    ingress:
      enabled: true
      hosts:
        - host: headlamp.atlas.lan
          paths: ["/"]
      ingressClassName: nginx